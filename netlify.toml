# Netlify deploy configuration.
#
# Before this file existed the site deployed with Netlify's defaults, which
# cost it twice: every asset was served with a bare ETag (so a returning
# visitor re-validated all ~40 logos, images and videos over the network on
# every visit), and there was no SPA fallback at all -- /services/<slug> and
# /ueber-uns are real pathnames handled by the client router, so a direct hit
# or a reload on one of them returned Netlify's 404 page.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------

# Vite fingerprints everything under /assets with a content hash, so a changed
# file always arrives under a new name. These can be cached permanently.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media lives at stable, unhashed paths, so it cannot be immutable -- replacing
# a case video must eventually reach people who already have it. A month of
# hot cache plus stale-while-revalidate gives repeat visits an instant paint
# while a replacement propagates in the background.
# Eine Stunde fest, danach eine Woche lang sofort aus dem Cache mit
# Auffrischung im Hintergrund.
#
# Vorher standen hier sieben Tage fest, und das hatte eine Kehrseite, die erst
# im Betrieb auffiel: diese Regel gilt fuer *jede* Antwort unter dem Pfad, auch
# fuer eine Fehlermeldung. Fehlte eine Datei kurz -- weil ihr Code einen Deploy
# frueher da war als sie selbst --, merkte sich der Browser die 404 fuer eine
# Woche und fragte auch dann nicht mehr nach, als die Datei laengst lag.
#
# Eine Stunde ist kurz genug, dass sich das von selbst erledigt, und
# stale-while-revalidate haelt den zweiten Besuch trotzdem sofort: die Datei
# kommt aus dem Cache, die Pruefung laeuft daneben.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

# The HTML shell names the current hashed bundles, so it must never be held
# past a deploy or the page boots against assets that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Keine Edge Function hier
# ---------------------------------------------------------------------------
# Hier stand ein "Torwaechter", der die Regel aus der robots.txt als Antwort
# durchgesetzt hat. Er selbst hatte keine einzige Abhaengigkeit -- aber sein
# Vorhandensein hat Netlifys Edge-Bundling ueberhaupt erst eingeschaltet, und
# damit fiel auch die Funktion in den Build, die die Integration "User Agent
# Blocker" erzeugt (erkennbar an USER_AGENT_BLOCKER_ANALYTICS in den
# Umgebungsvariablen). Die importiert @netlify/blobs, und npm-Module in Edge
# Functions sind dort experimentell: der Build brach ab.
#
# Also uebernimmt das Sperren die Integration, die dafuer eingerichtet ist,
# und dieses Verzeichnis bleibt leer. Die Regel selbst steht weiterhin lesbar
# in public/robots.txt.
#
# Nachtrag: die Integration allein reicht, um das Edge-Bundling einzuschalten
# -- sie legt ihre Funktion selbst in .netlify/edge-functions ab, ganz ohne
# unser Zutun. Und sie importiert @netlify/blobs, das der Bundler nur
# aufloesen kann, wenn das Paket in node_modules liegt. Es stand nirgends,
# also brach der Build ab ("Could not resolve @netlify/blobs").
#
# Deshalb steht @netlify/blobs in den dependencies der package.json, obwohl
# kein Zeile unseres Codes es importiert: es ist die Abhaengigkeit der
# Integration, nicht der Seite. Wer es dort aufraeumt, weil "das benutzt ja
# niemand", legt den naechsten Deploy lahm. Wird die Integration im Netlify-UI
# abgeschaltet, kann es mit weg.
# ---------------------------------------------------------------------------
# Renamed services
# ---------------------------------------------------------------------------
# "Messen & Events" became "Events & Erlebniswelten" and "Content & Streaming"
# became "Content & Live-Kommunikation". Both addresses are indexed, so they
# get a real 301 rather than being quietly rewritten -- a crawler is then told
# the page moved and carries its ranking across, instead of finding two URLs
# serving the same content.
#
# These must stay above the catch-all below: Netlify takes the first rule that
# matches, and the catch-all matches everything.
[[redirects]]
  from = "/services/messen-events"
  to = "/services/events-erlebniswelten"
  status = 301
  force = true

[[redirects]]
  from = "/services/content-streaming"
  to = "/services/content-live-kommunikation"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Fehlende Medien sind ein Fehler, keine Seite
# ---------------------------------------------------------------------------
# Das hier war die teuerste Zeile der Datei -- durch das, was sie *nicht* tat.
#
# Die SPA-Weiche unten faengt jede Adresse ab, unter der keine Datei liegt, und
# beantwortet sie mit index.html und Status 200. Fuer eine Route wie
# /best-cases/rewe ist das genau richtig. Fuer /images/rewe/hero.jpg ist es
# falsch: solange die Datei fehlte -- und die Case-Seiten standen Wochen vor
# ihren Bildern --, bekam jeder Aufruf die Startseite zurueck, mit Status 200
# und der langen Cache-Regel fuer /images/* obendrauf. Der Browser hat sich
# also gemerkt: unter dieser Bildadresse liegt HTML, und zwar wochenlang, ohne
# nachzufragen. Kam die Datei spaeter dazu, sah sie niemand mehr; das <img>
# bekam HTML, meldete einen Fehler, und die Kachel blieb schwarz.
#
# Deshalb enden Medienpfade jetzt vor der Weiche. Netlify liefert eine
# vorhandene Datei ohnehin zuerst aus, also greifen diese Regeln nur, wenn
# wirklich nichts da ist -- und dann sagen sie es, statt eine Seite zu
# schicken. Was einmal falsch im Cache liegt, raeumt der Versionsstempel aus
# components/site.ts (?v=N) ab.
[[redirects]]
  from = "/images/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/videos/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/logos/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/team/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/fonts/*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------------------------
# SPA fallback
# ---------------------------------------------------------------------------
# Netlify serves a real file whenever one exists at the requested path, so this
# only catches client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
