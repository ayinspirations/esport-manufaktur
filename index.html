<!DOCTYPE html>
<html lang="de" style="scroll-behavior: smooth;">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#020617" />
    <script>(function(){function s(e){if(e.error!=null&&!(e.error instanceof Error)){e.stopImmediatePropagation();e.stopPropagation();e.preventDefault();}}function r(e){if(!(e.reason instanceof Error)){e.stopImmediatePropagation();e.stopPropagation();e.preventDefault();}}window.addEventListener('error',s,true);window.addEventListener('unhandledrejection',r,true);})();</script>
    <title>GG Manufaktur | Eventtechnik, Gamification & Esport Events</title>
    <meta name="description" content="GG Manufaktur - Ihre Experten für Eventtechnik, Gamification und professionelle Esport-Events. Wir verwandeln Ihre Ideen in digitale Erlebnisse." />
    <meta name="keywords" content="eSport, Eventtechnik, Gamification, Esport Events, Gaming Marketing, Recruiting Events" />
    <meta property="og:title" content="GG Manufaktur | Eventtechnik & Gamification" />
    <meta property="og:description" content="Professionelle Eventtechnik und innovative Gamification-Lösungen für Ihr nächstes Projekt." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://esport-manufaktur.de" />

    <!-- Fonts are on a third-party origin, so the connection is warmed up in
         parallel with the HTML rather than after the stylesheet is discovered. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Archivo, variable, on two axes: weight 100-900 and width 62-125.

      It stands in for the CI's Helvetica Neue. Helvetica Neue is a licensed
      face -- a webfont licence is bought per domain and per traffic tier, and
      until one exists it cannot be served from here. Archivo is the closest
      free equivalent: a neo-grotesque built in the Helvetica/Univers
      tradition, and the only one on Google Fonts carrying both a real Black
      and a real condensed width, which is what the CI's three levels need
      (Condensed Black for headlines, Bold for sub-headings, Regular for copy).

      To switch to the licensed face later: drop the woff2 files in
      public/fonts, declare them with @font-face, and change the family name in
      index.css -- both the family and the two axes are used through that one
      declaration, so nothing else has to move.

      Loaded asynchronously. A plain <link rel="stylesheet"> to Google Fonts is
      render-blocking on a chain two hops long -- fonts.googleapis.com for the
      CSS, then fonts.gstatic.com for the woff2 it names -- and the page paints
      nothing until both land. The hero headline is the LCP element here, so
      that chain was holding up the one thing worth painting.

      media="print" makes the browser fetch the sheet at low priority without
      applying it; the onload flips it to "all" the moment it arrives. Text is
      painted immediately in the fallback stack below and re-flows when the
      face swaps in (the URL already carries display=swap).
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
    </noscript>

    <style>
      html, body {
        background-color: #020617;
      }
      body {
        /* The fallback the first paint actually uses. Helvetica Neue is named
           before the system stack: on a Mac it is installed, so those visitors
           see the CI face itself while the webfont is still in flight. */
        font-family: 'Archivo', 'Helvetica Neue', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        color: #0f172a;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .noise {
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.05;
        pointer-events: none;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(127, 145, 155, 0.32);
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      .perspective-1000 { perspective: 1000px; }
      .preserve-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotateY-180 { transform: rotateY(180deg); }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
