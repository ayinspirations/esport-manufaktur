<!DOCTYPE html>
<html lang="de" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <script>(function(){function s(e){if(e.error!=null&&!(e.error instanceof Error)){e.stopImmediatePropagation();e.stopPropagation();e.preventDefault();}}function r(e){if(!(e.reason instanceof Error)){e.stopImmediatePropagation();e.stopPropagation();e.preventDefault();}}window.addEventListener('error',s,true);window.addEventListener('unhandledrejection',r,true);})();</script>
    <title>GG Manufaktur | Eventtechnik, Gamification & Esport Events</title>
    <meta name="description" content="GG Manufaktur - Ihre Experten für Eventtechnik, Gamification und professionelle Esport-Events. Wir verwandeln Ihre Ideen in digitale Erlebnisse." />
    <meta name="keywords" content="eSport, Eventtechnik, Gamification, Esport Events, Gaming Marketing, Recruiting Events" />
    <meta property="og:title" content="GG Manufaktur | Eventtechnik & Gamification" />
    <meta property="og:description" content="Professionelle Eventtechnik und innovative Gamification-Lösungen für Ihr nächstes Projekt." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://esport-manufaktur.de" />

    <!-- Fonts are on a third-party origin, so the connection is warmed up in
         parallel with the HTML rather than after the stylesheet is discovered. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Echte Schnitte statt synthetischer.
         Bis 700 geladen und font-black (900) dem Browser ueberlassen hiesz:
         jede Headline wurde synthetisch fettgerechnet, und die kursiven
         Akzente ("zur GG Manufaktur.") zusaetzlich synthetisch geschert.
         Eine geschraegte Glyphe ragt aus ihrer Layoutbox heraus -- und die
         maskierten Headline-Reveals rastern waehrend ihrer Bewegung genau auf
         diese Box, sodass am Wortende Tinte abgeschnitten wurde. Am
         sichtbarsten in den ersten Millisekunden, solange noch die
         Systemschrift geschert wird.
         Die Variable-Font-Achsen kosten eine Datei je Schnitt-Gruppe, nicht
         eine je Gewicht: 300..900 plus Italic ist hier nicht mehr Gewicht als
         die fuenf festen Schnitte vorher. -->
    <!--
      Loaded asynchronously. A plain <link rel="stylesheet"> to Google Fonts is
      render-blocking on a chain two hops long -- fonts.googleapis.com for the
      CSS, then fonts.gstatic.com for the woff2 it names -- and the page paints
      nothing until both land. The hero headline is the LCP element here, so
      that chain was holding up the one thing worth painting.

      media="print" makes the browser fetch the sheet at low priority without
      applying it; the onload flips it to "all" the moment it arrives. Text is
      painted immediately in the fallback stack below and re-flows to Inter
      when it swaps in (the URL already carries display=swap).
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..900;1,300..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..900;1,300..900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..900;1,300..900&display=swap">
    </noscript>

    <style>
      html, body {
        background-color: #020617;
      }
      body {
        /* The system stack is the fallback the first paint actually uses, and
           on every target platform it is a humanist sans with metrics close
           enough to Inter that the swap does not visibly re-flow the page. */
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #0f172a;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .noise {
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.05;
        pointer-events: none;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(127, 145, 155, 0.32);
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      .perspective-1000 { perspective: 1000px; }
      .preserve-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotateY-180 { transform: rotateY(180deg); }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
