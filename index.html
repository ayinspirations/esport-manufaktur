    <script>(function(){function s(e){if(e.error!=null&&!(e.error instanceof Error)){e.stopImmediatePropagation();e.stopPropagation();e.preventDefault();}}function r(e){if(!(e.reason instanceof Error)){e.stopImmediatePropagation();e.stopPropagation();e.preventDefault();}}window.addEventListener('error',s,true);window.addEventListener('unhandledrejection',r,true);})();</script>
    <title>eSport Manufaktur | Eventtechnik, Gamification & Esport Events</title>

    <!-- Fonts are on a third-party origin, so the connection is warmed up in
         parallel with the HTML rather than after the stylesheet is discovered. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Weights deliberately stop at 700. font-black (900) therefore renders as
         a browser-synthesised bold -- that is the intended look here; do not
         add 800/900 to this URL without checking the headlines first. -->
    <!--
      Loaded asynchronously. A plain <link rel="stylesheet"> to Google Fonts is
      render-blocking on a chain two hops long -- fonts.googleapis.com for the
      CSS, then fonts.gstatic.com for the woff2 it names -- and the page paints
      nothing until both land. The hero headline is the LCP element here, so
      that chain was holding up the one thing worth painting.

      media="print" makes the browser fetch the sheet at low priority without
      applying it; the onload flips it to "all" the moment it arrives. Text is
      painted immediately in the fallback stack below and re-flows to Inter
      when it swaps in (the URL already carries display=swap).
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    </noscript>

    <style>
      html, body {
        background-color: #020617;
      }
      body {
        /* The system stack is the fallback the first paint actually uses, and
           on every target platform it is a humanist sans with metrics close
           enough to Inter that the swap does not visibly re-flow the page. */
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #0f172a;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      /* The grain was a live request to grainy-gradients.vercel.app: a
         third-party DNS lookup, TLS handshake and round trip, on the critical
         path, for a 1 kB tile. The same feTurbulence inlined as a data URI
         costs one gzipped line of HTML and no network at all.

         `translateZ(0)` keeps it on its own compositor layer. It is a fixed,
         full-viewport element sitting above the whole page, so without a layer
         of its own every scroll frame repaints the grain across the entire
         viewport along with whatever moved underneath it. */
      .noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        opacity: 0.05;
        pointer-events: none;
        transform: translateZ(0);
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #badeda;
      }
      ::-webkit-scrollbar-thumb {
        background: #0e958e;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10b981;
      }
      .perspective-1000 { perspective: 1000px; }
      .preserve-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotateY-180 { transform: rotateY(180deg); }
    </style>
